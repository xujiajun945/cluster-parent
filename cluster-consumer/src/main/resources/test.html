<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test Login</title>
    <script type="text/javascript">
        function sessionLogin() {
            let username = document.getElementById("username");
            let password = document.getElementById("password");
            let status = document.getElementById('status');
            let result = document.getElementById('result');

            fetch('http://localhost:8081/consumer/login/normal', {
                method: 'post',
                credentials: 'include',
                headers: {
                    'Content-Type': "application/json"
                },
                body: JSON.stringify({
                    'username': username.value,
                    'password': password.value
                })
            })
            .then(response => {
                status.innerText = '状态： ' + response.status;
                return response.json();
            })
            .then(response => {
                console.log(response);
                result.innerText = JSON.stringify(response);
            })
        }

        function jwtLogin() {
            let username = document.getElementById("username");
            let password = document.getElementById("password");
            let status = document.getElementById('status');
            let result = document.getElementById('result');

            fetch('http://localhost:8081/consumer/login/jwt', {
                method: 'post',
                headers: {
                    'Content-Type': 'application/json',
                    'auth': localStorage.getItem('token')
                },
                body: JSON.stringify({
                    'username': username.value,
                    'password': password.value
                })
            })
            .then(response => {
                console.log(response);
                status.innerText = '状态： ' + response.status;
                return response.json();
            })
            .then(response => {
                console.log(response);
                let jwt = response.data.token;
                console.log(jwt);
                localStorage.setItem('token', jwt)
                result.innerText = JSON.stringify(response);
            })
        }

        function checkJwt() {
            let status = document.getElementById('status');
            let result = document.getElementById('result');

            fetch('http://localhost:8081/demo/consumer/json_mapper', {
                method: 'get',
                headers: {
                    'auth': localStorage.getItem('token')
                }
            })
            .then(res => {
                console.log(res);
                status.innerText = '状态： ' + res.status;
                return res.json();
            })
            .then(res => {
                result.innerText = JSON.stringify(res);
            })
        }
    </script>
</head>
<body>
    用户名：<input type="text" id="username"><br>
    密码：<input type="text" id="password"><br>
    <button type="button" onclick="sessionLogin()">传统session登录</button><br>
    <button type="button" onclick="jwtLogin()">jwt登录</button><br>
    <button type="button" onclick="checkJwt()">校验jwtToken</button><br><br><br>
    <b id="status">状态</b>
    <p id="result"></p>
</body>
</html>
