server:
  port: 8081
  servlet:
    session:
      cookie:
        # 设置sessionId cookie的失效时间（单位：s）
        max-age: 120
        name: clusterSession

spring:
  profiles:
    active: @suffix.name@
  application:
    name: cluster-consumer
  cloud:
    nacos:
      config:
        server-addr: 192.168.184.129:8848
        username: nacos
        password: xujiajun945
        refresh-enabled: true
        namespace: public
      discovery:
        server-addr: 192.168.184.129:8848
        # 服务分组
        group: demo01
    # 开启负载均衡
    loadbalancer:
      enabled: true
      # 开启负载均衡缓存（减少对注册中心的请求频率）
      cache:
        enabled: true
        # 缓存过期时间，默认35s
        ttl: 60s
        # 缓存区大小，默认256条
        capacity: 1024
    openfeign:
      httpclient:
        hc5:
          enabled: true
  config:
    # nacos:[dataId]?group=[group]
    import[0]: nacos:demo?group=default

cluster:
  provider:
    cluster-provider: cluster-provider